baseURL = 'https://podcastatlas.ai/'
locale = 'en-us'
title = 'Podcast Atlas'
theme = 'hugo-xmin'
preview_urls = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[outputs]
page = ['html','markdown']

[taxonomies]
category = 'categories'
tag = 'tags'
show = 'show'

[permalinks]
  [permalinks.taxonomy]
    show = '/shows/'
  [permalinks.term]
    show = '/shows/:slug/'
