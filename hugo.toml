baseURL = 'https://podcastatlas.ai/'
locale = 'en-us'
title = 'Podcast Atlas'
theme = 'hugo-xmin'
preview_urls = false
ignoreFiles = ['(^|/)(content/)?wiki/(index|log)\.md$', '(^|/)content/wiki/overview\.md$']

[uglyURLs]
  episodes = true

[outputFormats.html]
  noUgly = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[outputs]
page = ['html','markdown']
taxonomy = ['html']
term = ['html']

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
    files = ['! wiki/index.md', '! wiki/log.md']

[taxonomies]
category = 'categories'
tag = 'tags'
show = 'show'

[permalinks]
  [permalinks.taxonomy]
    show = '/shows/'
  [permalinks.term]
    show = '/shows/:slug/'
