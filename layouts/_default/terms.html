{{ define "main" }}
  {{ if eq .Data.Singular "show" }}
    <h1>Shows</h1>
    <p class="lede">Browse episodes by show.</p>
  {{ else }}
    <h1>{{ .Title }}</h1>
  {{ end }}

  <ul class="show-list">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
        {{ $count := int .Count }}
        <span class="show-count">{{ $count }} episode{{ if ne $count 1 }}s{{ end }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
